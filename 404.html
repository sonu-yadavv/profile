<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Sonu Yadav</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', stored || system);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/profile/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/profile/style.css">
  <style>
    .oops { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .oops .code { font-size: clamp(4rem, 16vw, 8rem); font-weight: 800; letter-spacing: -.05em; color: var(--accent); line-height: 1; }
    .oops h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 14px 0 10px; }
    .oops p { color: var(--text-2); max-width: 46ch; margin: 0 auto 26px; }
  </style>
</head>

<body>
  <main class="oops">
    <div>
      <p class="code">404</p>
      <h1>That page does not exist</h1>
      <p>The link may be out of date, or the address might have a typo in it. Everything lives on one page here.</p>
      <a class="btn btn-primary" href="/profile/">Back to the portfolio</a>
    </div>
  </main>
</body>

</html>
