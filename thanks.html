<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message sent — Sonu Yadav</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', stored || system);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/profile/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/profile/style.css">
  <style>
    .done { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .done .tick { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--accent); }
    .done h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); margin-bottom: 10px; }
    .done p { color: var(--text-2); max-width: 46ch; margin: 0 auto 26px; }
  </style>
</head>

<body>
  <main class="done">
    <div>
      <svg class="tick" viewBox="0 0 24 24" aria-hidden="true" stroke-width="1.6">
        <circle cx="12" cy="12" r="9.2"/><path d="m7.8 12.3 2.8 2.8 5.6-6"/>
      </svg>
      <h1>Message sent</h1>
      <p>Thanks for getting in touch — I read everything and will reply to the address you gave.</p>
      <a class="btn btn-primary" href="/profile/">Back to the portfolio</a>
    </div>
  </main>
</body>

</html>
